version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: audio-pipeline-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
    networks:
      - audio-pipeline-net

  app:
    build: .
    container_name: audio-pipeline-app
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      MONGODB_URI: mongodb://admin:password@mongodb:27017
      MONGODB_DB: audio_pipeline
    depends_on:
      - mongodb
    networks:
      - audio-pipeline-net
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  audio-pipeline-net:
    driver: bridge
