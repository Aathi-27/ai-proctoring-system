[project]
name = "post-exam-integrity-reporting"
version = "0.1.0"
description = "FastAPI service for post-exam integrity report generation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "uvicorn>=0.27",
  "jinja2>=3.1",
  "reportlab>=4.0",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
mongo = [
  "motor>=3.4",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
